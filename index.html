  return out;
}

// 最新股價日（週末／假期時「單日」其實係上一個交易日）
const pxDay = tk => PX[tk]?.d ? md(Date.parse(PX[tk].d + 'T21:00:00Z')) + ' 單日' : '單日';
let VIEW = 'today', DRILL = null, DRILL_W = 7, SORT = {key: 'bullSig', dir: -1};

// 每條觀點同同一帳號對同一隻股上一次講法比：表態／轉中性／反轉／加強／減弱
{
  const prev = {};
  for (const o of ALL_OPS) {
    const k = o.handle + '|' + o.ticker, p = prev[k];
    if (p && p.stance !== o.stance) {
      if (p.stance !== 'neutral' && o.stance !== 'neutral') o.chg = ['反轉', 'flip'];
      else if (o.stance === 'neutral') o.chg = ['轉中性', 'down'];
      else o.chg = ['表態', o.stance === 'bull' ? 'up' : 'down'];
    } else if (p && o.stance !== 'neutral' && o.strength !== p.strength) {
      o.chg = o.strength > p.strength ? ['加強', o.stance === 'bull' ? 'up' : 'down'] : ['減弱', 'down'];
    }
    if (o.chg) o.prev = p;
    prev[k] = o;
  }
}
const chgB = o => o.chg ? `<span class="chgb ${o.chg[1]}" title="上一次：${LABEL[o.prev.stance]}（${md(o.prev.ts)}）">${o.chg[0]}</span>` : '';
// 重要觀點：有明確立場而且清楚表態（強度 ≥2），或者立場有變
const isKey = o => o.stance !== 'neutral' && (o.strength >= 2 || (o.chg && o.chg[0] !== '減弱'));
const keyScore = o => o.strength * 2 + (o.chg ? (o.chg[0] === '反轉' ? 3 : 2) : 0);

// 發帖當日（或之前最近一個交易日）收市價 → 最新價
function pxAt(tk, ts) {
  const s = PX[tk]?.series;
  if (!s) return null;
  const d = new Date(ts).toISOString().slice(0, 10);
  let v = null, i = -1;
  for (const [sd, c] of s) { if (sd <= d) { v = c; i++; } else break; }
  // 發帖之後仲未有新交易日（例如週末帖）：冇嘢好比，當冇
  return i < s.length - 1 ? v : null;
}
const since = o => { const p0 = pxAt(o.ticker, o.ts), p = PX[o.ticker]; return p0 && p ? p.last / p0 - 1 : null; };

const between = (from, to) => OPS.filter(o => o.ts >= from && o.ts <= to);
function rangeFor(v) {
  if (v === 'week') return {days: 7, ops: between(NOW - 7 * DAY, NOW)};
  if (v === 'month') return {days: 28, ops: between(NOW - 28 * DAY, NOW)};
  let days = 1, ops = between(NOW - DAY, NOW);
  if (ops.filter(o => o.stance !== 'neutral').length < 3) { days = 2; ops = between(NOW - 2 * DAY, NOW); }
  return {days, ops};
}

function groups(ops) {
  const by = {};
  for (const o of ops) {
    const g = by[o.ticker] ??= {tk: o.ticker, latest: {}, all: []};
    g.latest[o.handle] = o; g.all.push(o);
  }
  return Object.values(by).map(g => {
    const L = Object.values(g.latest);
    const bull = L.filter(o => o.stance === 'bull'), bear = L.filter(o => o.stance === 'bear');
    const kind = bull.length && bear.length ? 'split' : bull.length >= 2 ? 'bull' : bear.length >= 2 ? 'bear' : 'other';
    return {...g, L, bull, bear, neu: L.length - bull.length - bear.length, kind, mentions: g.all.length,
      bullSig: g.all.filter(o => o.stance === 'bull').length, bearSig: g.all.filter(o => o.stance === 'bear').length};
  });
}
const kindTitle = g => g.kind === 'split' ? `${g.bull.length} 睇好 · ${g.bear.length} 睇淡` : g.kind === 'bull' ? `${g.bull.length} 個帳號睇好` : g.kind === 'bear' ? `${g.bear.length} 個帳號睇淡` : `${g.L.length} 個帳號提及`;

function viewCard(g, cls, title) {
  const rows = g.L.slice().sort((a, b) => ORDER[a.stance] - ORDER[b.stance] || b.ts - a.ts);
  return `<div class="box vc ${cls}"><div class="vc-h"><button class="big" data-drill="${esc(g.tk)}">${esc(g.tk)}</button>
    <span class="num">${pct(PX[g.tk]?.r1d)} <span class="muted" style="font-size:11px">${pxDay(g.tk)}</span></span></div>
    <div class="muted" style="font-size:12px;margin:-2px 0 8px">${title}</div>
    <ul>${rows.map(o => `<li><span class="who"><span class="dot ${o.stance}"></span>${accBtn(o.handle)}</span><span class="why">${esc(o.summary)}</span>${post(o)}</li>`).join('')}</ul></div>`;
}

function changes(days, pred = () => true) {
  const out = {}, start = NOW - days * DAY;
  for (const o of OPS) if (o.chg && o.ts >= start && pred(o)) out[o.handle + '|' + o.ticker] = o;
  return Object.values(out).sort((a, b) => b.ts - a.ts);
}
const changeList = (cs, limit = 15, empty = '呢段時間冇帳號改變立場（同佢上一次講法比較）。') => cs.length ? `<div class="box">${cs.slice(0, limit).map(o => `<div class="chg"><span class="kind ${o.chg[1]}">${o.chg[0]}</span>
  <span>${accBtn(o.handle)} · ${tkBtn(o.ticker)} · ${LABEL[o.prev.stance]} → ${LABEL[o.stance]}</span>
  <span class="sub">${md(o.prev.ts)}：${esc(o.prev.summary)}<br>${md(o.ts)}：${esc(o.summary)} ${post(o)}</span></div>`).join('')}</div>`
  : `<p class="empty">${empty}</p>`;

// 觀點列表（時間線）：可以揀顯唔顯示帳號／股票，加埋發帖後股價
function opList(os, {who = true, tk = true, px = false} = {}) {
  return `<ul class="tl">${os.map(o => {
    const r = px && o.stance !== 'neutral' ? since(o) : null;
    return `<li><span class="muted num">${md(o.ts)}</span><span>${who ? `<strong>${accBtn(o.handle)}</strong>` : ''}${who && tk ? ' ' : ''}${tk ? tkBtn(o.ticker) : ''}</span>
      <span>${pill(o)} ${chgB(o)} ${esc(o.summary)} ${post(o)}${r != null ? ` <span class="muted" style="font-size:12px">發帖後股價</span> ${pct(r)}` : ''}</span></li>`;
  }).join('')}</ul>`;
}
const keyViews = (os, n) => os.filter(isKey).sort((a, b) => keyScore(b) - keyScore(a) || b.ts - a.ts).slice(0, n);

const stat = (k, v) => `<div class="box stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const statBoxes = ops => `<div class="grid g4">${stat('參與帳號', `${new Set(ops.map(o => o.handle)).size} / ${ACCS.length}`)}${stat('提及', ops.length)}${stat('睇好訊號', `<span class="up">${ops.filter(o => o.stance === 'bull').length}</span>`)}${stat('睇淡訊號', `<span class="down">${ops.filter(o => o.stance === 'bear').length}</span>`)}</div>`;
const deltaSpan = d => `<span class="num ${d > 0 ? 'up' : d < 0 ? 'down' : 'muted'}" style="font-size:12px">${d > 0 ? '+' + d : d < 0 ? d : '±0'}</span>`;
const who3 = L => L.slice().sort((a, b) => ORDER[a.stance] - ORDER[b.stance]).map(o => `<span style="white-space:nowrap"><span class="dot ${o.stance}"></span>${accBtn(o.handle)}</span>`).join(' ');

function renderToday() {
  const {days, ops} = rangeFor('today');
  const G = groups(ops);
  const rangeNote = days === 2 ? `<span class="n">有效數據唔夠，已合併前一日（${md(NOW - 2 * DAY)}–${md(NOW)}）</span>` : `<span class="n">${md(NOW)}</span>`;
  const cards = ACCS.map(a => {
    const last = {};
    for (const o of ops.filter(o => o.handle === a.handle)) last[o.ticker] = o;
    const L = Object.values(last);
    const b = L.filter(o => o.stance === 'bull'), r = L.filter(o => o.stance === 'bear'), n = L.filter(o => o.stance === 'neutral');
    const row = (cls, lab, xs, tcls, none) => `<div class="row"><span class="lab ${cls}">${lab}</span>${xs.length ? xs.map(o => tkBtn(o.ticker, tcls)).join('') : `<span class="muted">${none}</span>`}</div>`;
    const body = L.length
      ? row('bull', '睇好', b, 'bull', '冇') + row('bear', '睇淡', r, 'bear', '冇') + row('neu', '冇表態', n, '', '冇')
      : `<div class="row muted">呢段時間冇提及個股</div>`;
    const chk = D.checked?.[a.handle];
    return `<div class="box"><div class="acc-h"><div>${accBtn(a.handle)}
      <div class="h"><a href="https://x.com/${esc(a.handle)}" target="_blank" rel="noopener">@${esc(a.handle)}</a></div></div><span class="badge ${esc(a.type)}">${TYPE[a.type] || ''}</span></div>
      <div class="desc" title="${esc(a.note)}">${esc(a.note)}</div>${body}
      ${chk ? `<div class="note">最後檢查 ${md(Date.parse(chk))}</div>` : ''}</div>`;
  }).join('');
  const today = ptDate(NOW), aDates = Object.keys(D.analyses || {}).filter(d => d <= today).sort(), aDate = aDates[aDates.length - 1];
  const aNote = aDate ? `<span class="n">${esc(aDate)}${aDate !== today ? '（嗰日未有分析，顯示之前最近一份）' : ''}</span>` : '';
  const byAcc = k => G.filter(g => g.kind === k).sort((x, y) => y.L.length - x.L.length);
  const sb = byAcc('bull'), sr = byAcc('bear'), sp = byAcc('split');
  const pc = {}; for (const o of between(NOW - 2 * days * DAY, NOW - days * DAY)) pc[o.ticker] = (pc[o.ticker] || 0) + 1;
  const all = G.map(g => ({...g, d: g.mentions - (pc[g.tk] || 0)})).sort((a, b) => b.L.length - a.L.length || b.mentions - a.mentions || b.d - a.d);
  const kv = keyViews(ops, 12);
  $('view').innerHTML = `
    <h2>${ACCS.length} 個帳號${NOW === GEN ? '今日' : '當日'}狀態${rangeNote}</h2>
    <div class="grid g4">${cards}</div>
    <h2>${NOW === GEN ? '今日' : '當日'}市場分析${aNote}</h2>
    ${aDate ? `<div class="analysis"><p>${esc(D.analyses[aDate])}</p></div>` : '<p class="empty">未有分析。</p>'}
    <h2>一致睇好<span class="n">≥2 個帳號睇好、冇人睇淡</span></h2>
    ${sb.length ? `<div class="grid g3">${sb.map(g => viewCard(g, 'bull', kindTitle(g))).join('')}</div>` : '<p class="empty">今日冇一致睇好嘅股票。</p>'}
    <h2>一致睇淡<span class="n">≥2 個帳號睇淡、冇人睇好</span></h2>
    ${sr.length ? `<div class="grid g3">${sr.map(g => viewCard(g, 'bear', kindTitle(g))).join('')}</div>` : '<p class="empty">今日冇一致睇淡嘅股票。</p>'}
    <h2>多空分歧<span class="n">同一隻股有人睇好、有人睇淡</span></h2>
    ${sp.length ? `<div class="grid g3">${sp.map(g => viewCard(g, '', kindTitle(g))).join('')}</div>` : '<p class="empty">今日冇明顯分歧。</p>'}
    <h2>重要觀點<span class="n">清楚表態（強度 ≥2）或者立場有變，按重要程度排</span></h2>
    ${kv.length ? `<div class="box">${opList(kv, {px: true})}</div>` : '<p class="empty">今日冇清楚表態嘅觀點。</p>'}
    <h2>今日提及嘅全部股票<span class="n">${all.length} 隻；變化＝提及次數同前一段同樣長嘅時間比</span></h2>
    ${all.length ? `<div class="scroll"><table><thead><tr><th>股票</th><th>提及</th><th>變化</th><th>邊個講、點講</th><th>股價</th></tr></thead><tbody>${all.map(g => `<tr>
      <td>${tkBtn(g.tk, g.kind === 'bull' ? 'bull' : g.kind === 'bear' ? 'bear' : '')}</td><td class="num">${g.mentions}</td><td>${deltaSpan(g.d)}</td>
      <td class="why">${who3(g.L)}</td><td>${pct(PX[g.tk]?.r1d)} <span class="muted" style="font-size:11px">${pxDay(g.tk)}</span></td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">冇提及。</p>'}`;
}

function renderWeek() {
  const {ops} = rangeFor('week');
  const G = groups(ops);
  const prev = between(NOW - 14 * DAY, NOW - 7 * DAY), pc = {};
  for (const o of prev) pc[o.ticker] = (pc[o.ticker] || 0) + 1;
  G.forEach(g => g.d = g.mentions - (pc[g.tk] || 0));
  const rank = (a, b) => b.L.length - a.L.length || b.mentions - a.mentions;
  const agree = G.filter(g => g.kind === 'bull' || g.kind === 'bear').sort(rank);
  const split = G.filter(g => g.kind === 'split').sort((a, b) => Math.min(b.bull.length, b.bear.length) - Math.min(a.bull.length, a.bear.length) || rank(a, b));
  const other = G.filter(g => g.kind === 'other' && g.L.length >= 2).sort(rank);
  const focus = ACCS.map(a => {
    const mine = ops.filter(o => o.handle === a.handle), d = mine.length - prev.filter(o => o.handle === a.handle).length;
    const c = {};
    for (const o of mine) { const x = c[o.ticker] ??= {n: 0, b: 0, r: 0}; x.n++; if (o.stance === 'bull') x.b++; if (o.stance === 'bear') x.r++; }
    const top = Object.entries(c).sort((x, y) => y[1].n - x[1].n).slice(0, 5);
    const flips = changes(7, o => o.handle === a.handle).length;
    return `<div class="box"><div class="acc-h"><div>${accBtn(a.handle)} <span class="h">@${esc(a.handle)}</span></div>
      <span class="num">${mine.length} 次 ${deltaSpan(d)}</span></div>
      <div class="row">${top.length ? top.map(([tk, v]) => tkBtn(tk, v.b > v.r ? 'bull' : v.r > v.b ? 'bear' : '')).join('') : '<span class="muted">本週冇講個股</span>'}</div>
      ${flips ? `<div class="note">本週 ${flips} 次立場變化</div>` : ''}</div>`;
  }).join('');
  const dist = G.slice().sort(rank);
  $('view').innerHTML = `
    <h2>近 7 日<span class="n">${md(NOW - 7 * DAY)}–${md(NOW)}</span></h2>${statBoxes(ops)}
    <h2>強烈共識<span class="n">≥2 個帳號同一方向、冇人唱反調</span></h2>
    ${agree.length ? `<div class="grid g3">${agree.slice(0, 12).map(g => viewCard(g, g.kind, kindTitle(g))).join('')}</div>` : '<p class="empty">本週冇多個帳號一致嘅股票。</p>'}
    <h2>重大分歧<span class="n">同一隻股有人睇好、有人睇淡；雙方人數愈接近排愈前</span></h2>
    ${split.length ? `<div class="grid g3">${split.slice(0, 12).map(g => viewCard(g, '', kindTitle(g))).join('')}</div>` : '<p class="empty">本週冇明顯分歧。</p>'}
    <h2>其他多帳號關注<span class="n">≥2 個帳號講過，但未夠兩個同方向</span></h2>
    ${other.length ? `<div class="box"><div class="row" style="gap:10px 18px">${other.map(g => `<span>${tkBtn(g.tk)} <span class="muted" style="font-size:12px">${g.L.length} 個帳號 · ${g.bull.length} 好 ${g.bear.length} 淡 ${g.neu} 冇表態</span></span>`).join('')}</div></div>` : '<p class="empty">冇。</p>'}
    <h2>立場分佈同討論熱度<span class="n">每個帳號最新立場；變化＝同再之前 7 日比</span></h2>
    ${dist.length ? `<div class="scroll"><table><thead><tr><th>股票</th><th>立場分佈</th><th>提及</th><th>變化</th><th>28 日回報</th><th>邊個講過</th></tr></thead><tbody>${dist.map(g => {
      const n = g.L.length;
      return `<tr><td>${tkBtn(g.tk)}</td><td><div class="split"><div class="bar"><i class="b" style="width:${g.bull.length / n * 100}%"></i><i class="n" style="width:${g.neu / n * 100}%"></i><i class="r" style="width:${g.bear.length / n * 100}%"></i></div>
        <div class="lbl"><span class="up">${g.bull.length} 睇好</span><span class="muted">${g.neu} 唔明確</span><span class="down">${g.bear.length} 睇淡</span></div></div></td>
        <td class="num">${g.mentions}</td><td>${deltaSpan(g.d)}</td><td>${pct(PX[g.tk]?.r28)}</td><td class="why">${who3(g.L)}</td></tr>`;
    }).join('')}</tbody></table></div>` : '<p class="empty">冇數據。</p>'}
    <h2>每個帳號本週焦點<span class="n">提及次數（同上週比）；綠＝睇好為主、紅＝睇淡為主</span></h2>
    <div class="grid g4">${focus}</div>
    <h2>立場變化<span class="n">同佢上一次講法比</span></h2>${changeList(changes(7))}`;
}

function consistency(os) {
  const by = {};
  for (const o of os) (by[o.ticker] ??= []).push(o.stance);
  const scored = Object.values(by).filter(s => s.length >= 2);
  if (!scored.length) return null;
  return scored.reduce((sum, s) => { const c = {}; s.forEach(x => c[x] = (c[x] || 0) + 1); return sum + Math.max(...Object.values(c)) / s.length; }, 0) / scored.length;
}

// 近 28 日分四週：每週提及次數，顏色跟嗰週淨立場
function spark(os) {
  const w = [0, 1, 2, 3].map(() => ({n: 0, b: 0, r: 0}));
  for (const o of os) {
    const i = Math.max(0, Math.min(3, Math.floor((o.ts - (NOW - 28 * DAY)) / (7 * DAY))));
    w[i].n++; if (o.stance === 'bull') w[i].b++; if (o.stance === 'bear') w[i].r++;
  }
  const mx = Math.max(1, ...w.map(x => x.n));
  return `<span class="spark" title="四週提及：${w.map(x => x.n).join(' → ')}">${w.map(x => `<i class="${!x.n ? 'z' : x.b > x.r ? 'b' : x.r > x.b ? 'r' : ''}" style="height:${x.n ? Math.max(12, x.n / mx * 100) : 8}%"></i>`).join('')}</span>`;
}

function renderMonth() {
  const {ops} = rangeFor('month');
  const G = groups(ops);
  const prevOps = between(NOW - 56 * DAY, NOW - 28 * DAY), pc = {};
  for (const o of prevOps) pc[o.ticker] = (pc[o.ticker] || 0) + 1;
  const bullN = ops.filter(o => o.stance === 'bull').length, bearN = ops.filter(o => o.stance === 'bear').length;
  const flips = changes(28).filter(x => x.chg[0] === '反轉');
  const tops = ACCS.map(a => {
    const c = {};
    for (const o of ops.filter(o => o.handle === a.handle)) { const x = c[o.ticker] ??= {b: 0, n: 0, last: 0}; x.n++; if (o.stance === 'bull') x.b++; x.last = Math.max(x.last, o.ts); }
    const best = Object.entries(c).filter(([, v]) => v.b > 0).sort((x, y) => y[1].b - x[1].b || y[1].n - x[1].n || y[1].last - x[1].last)[0];
    return `<div class="box"><div>${accBtn(a.handle)} <span class="muted" style="font-size:12px">@${esc(a.handle)}</span></div>
      ${best ? `<div class="vc-h" style="margin:8px 0 0"><button class="big" data-drill="${esc(best[0])}">${esc(best[0])}</button><span style="text-align:right"><span class="muted" style="font-size:11px;display:block">一年回報</span>${pct(PX[best[0]]?.r1y)}</span></div>
        <div class="muted" style="font-size:12px">睇好 ${best[1].b} · 總提及 ${best[1].n} · 28 日 ${pct(PX[best[0]]?.r28)}</div>` : '<p class="empty">本月冇明確睇好嘅股</p>'}</div>`;
  }).join('');
  const rows = G.map(g => { const s = g.bullSig + g.bearSig; return {...g, d: g.mentions - (pc[g.tk] || 0), bp: s ? g.bullSig / s : null, r1y: PX[g.tk]?.r1y ?? null, r28: PX[g.tk]?.r28 ?? null}; });
  const movers = rows.slice().sort((a, b) => b.d - a.d);
  const up = movers.filter(r => r.d > 0).slice(0, 8), down = movers.filter(r => r.d < 0).reverse().slice(0, 8);
  const gone = Object.entries(pc).filter(([tk]) => !G.some(g => g.tk === tk)).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const val = x => x == null ? -1e9 : x;
  rows.sort((a, b) => (val(a[SORT.key]) - val(b[SORT.key])) * SORT.dir || b.mentions - a.mentions);
  const th = (k, t) => `<th><button data-sort="${k}" ${SORT.key === k ? `aria-sort="${SORT.dir < 0 ? 'descending' : 'ascending'}"` : ''}>${t}${SORT.key === k ? (SORT.dir < 0 ? ' ↓' : ' ↑') : ''}</button></th>`;
  const accRows = ACCS.map(a => {
    const mine = ops.filter(o => o.handle === a.handle), c = consistency(mine);
    return `<tr><td>${accBtn(a.handle)} <span class="muted">@${esc(a.handle)}</span></td><td class="num">${mine.length}</td>
      <td class="num">${new Set(mine.map(o => o.ticker)).size}</td><td class="num">${c == null ? '<span class="muted">樣本不足</span>' : Math.round(c * 100) + '%'}</td>
      <td class="num">${flips.filter(x => x.handle === a.handle).length}</td></tr>`;
  }).join('');
  const moverRow = r => `<span>${tkBtn(r.tk)} <span class="num">${pc[r.tk] || 0} → ${r.mentions}</span> ${spark(r.all)}</span>`;
  $('view').innerHTML = `
    <h2>近 28 日<span class="n">${md(NOW - 28 * DAY)}–${md(NOW)}</span></h2>

      <td>${pct(g.r1y)}</td><td>${pct(g.r28)}</td><td class="num">${g.mentions}</td><td>${deltaSpan(g.d)}</td><td>${spark(g.all)}</td><td class="num up">${g.bullSig}</td><td class="num down">${g.bearSig}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">冇數據。</p>'}
    <h2>帳號立場一致性<span class="n">同一隻股講過兩次以上，立場有幾一致；反轉＝睇好同睇淡之間轉換</span></h2>
    <div class="scroll"><table><thead><tr><th>帳號</th><th>提及</th><th>講過幾多隻</th><th>立場一致性</th><th>反轉</th></tr></thead><tbody>${accRows}</tbody></table></div>
    <h2>立場變化<span class="n">同佢上一次講法比</span></h2>${changeList(changes(28), 25)}`;
}

function priceChart(tk, ops) {
  const p = PX[tk];
  if (!p || !p.series || p.series.length < 2) return '<p class="empty">冇股價資料（可能係非美國上市代號、私人公司或者拉唔到報價）。</p>';
  const at = d => Date.parse(d + 'T21:00:00Z');
  // 由呢隻股第一條觀點前兩星期開始畫，最少 28 日
  const first = ops.length ? ops[0].ts : NOW;
  const from = Math.min(first - 14 * DAY, NOW - 28 * DAY);
  const S = p.series.map(([d, v]) => ({t: at(d), d, v})).filter(s => s.t >= from);
  if (S.length < 2) return '<p class="empty">股價資料唔夠畫圖。</p>';
  const W = 760, H = 220, L = 50, R = 14, T = 14, B = 26;
  const lo = Math.min(...S.map(s => s.v)), hi = Math.max(...S.map(s => s.v)), pad = (hi - lo) * .1 || hi * .02;
  const y0 = lo - pad, y1 = hi + pad, t0 = S[0].t, t1 = S[S.length - 1].t;
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const line = S.map((s, i) => `${i ? 'L' : 'M'}${X(s.t).toFixed(1)},${Y(s.v).toFixed(1)}`).join('');
  const ticks = [y0 + (y1 - y0) * .15, (y0 + y1) / 2, y1 - (y1 - y0) * .15];
  const byDay = {};
  for (const o of ops) { const d = new Date(o.ts).toISOString().slice(0, 10); if (at(d) >= t0 - DAY) (byDay[d] ??= []).push(o); }
  const marks = Object.entries(byDay).map(([d, os]) => {
    const near = S.reduce((best, s) => Math.abs(s.t - at(d)) < Math.abs(best.t - at(d)) ? s : best, S[0]);
    const b = os.filter(o => o.stance === 'bull').length, r = os.filter(o => o.stance === 'bear').length;
    const col = b > r ? 'var(--bull)' : r > b ? 'var(--bear)' : 'var(--neu)';
    const big = os.some(isKey);
    return `<circle cx="${X(near.t).toFixed(1)}" cy="${Y(near.v).toFixed(1)}" r="${big ? 6.5 : 4.5}" fill="var(--surface)" stroke="${col}" stroke-width="${big ? 3 : 2}"><title>${d}：${esc(os.map(o => nm(o.handle) + ' ' + LABEL[o.stance] + (o.chg ? '（' + o.chg[0] + '）' : '') + '：' + o.summary).join('\n'))}</title></circle>`;
  }).join('');
  const mid = S[Math.floor(S.length / 2)];
  const fmt = v => v >= 100 ? v.toFixed(0) : v.toFixed(2);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tk)} 收市價同觀點標記">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join('')}
    <path d="${line}L${X(t1).toFixed(1)},${H - B}L${L},${H - B}Z" fill="var(--chip)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--ink-2)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${X(t1).toFixed(1)}" cy="${Y(S[S.length - 1].v).toFixed(1)}" r="3" fill="var(--ink)"/>
    ${marks}
    <text x="${L}" y="${H - 6}">${S[0].d.slice(5).split("-").map(Number).join("/")}</text><text x="${X(mid.t).toFixed(1)}" y="${H - 6}" text-anchor="middle">${mid.d.slice(5).split("-").map(Number).join("/")}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${S[S.length - 1].d.slice(5).split("-").map(Number).join("/")}</text>
  </svg><div class="muted" style="font-size:12px">圓圈＝嗰日有帳號發表觀點（綠＝睇好多、紅＝睇淡多、灰＝中性；大圈＝有重要觀點）；滑鼠停喺圓圈睇邊個講乜。</div></div>`;
}

// 觀點之後股價：睇好／睇淡觀點發出後，股價到而家升跌幾多（描述用，唔係勝率）
function afterPx(os) {
  const x = os.filter(o => o.stance !== 'neutral').map(o => ({o, r: since(o)})).filter(v => v.r != null);
  const avg = s => s.length ? s.reduce((a, v) => a + v.r, 0) / s.length : null;
  const b = x.filter(v => v.o.stance === 'bull'), r = x.filter(v => v.o.stance === 'bear');
  return {x, b, r, bAvg: avg(b), rAvg: avg(r)};
}

const winSeg = () => `<span class="seg" style="margin-left:auto" role="group" aria-label="追查時間範圍">${[[1, '今日'], [7, '近 7 日'], [28, '近 28 日'], [365, '全部']].map(([w, t]) => `<button data-dw="${w}" aria-pressed="${w === DRILL_W}">${t}</button>`).join('')}</span>`;
const wLabel = () => DRILL_W === 1 ? '今日' : DRILL_W === 365 ? '全部記錄' : `近 ${DRILL_W} 日`;

function renderDrill() {
  if (!DRILL) { $('drill').innerHTML = ''; return; }
  if (DRILL.k === 'acc') return renderAccount(DRILL.id);
  const tk = DRILL.id, p = PX[tk], allT = OPS.filter(o => o.ticker === tk);
  const win = between(NOW - DRILL_W * DAY, NOW).filter(o => o.ticker === tk);
  const per = {}; for (const o of win) (per[o.handle] ??= []).push(o);
  const GA = {bullOnly: [], bearOnly: [], mixed: [], unclear: [], none: []};
  for (const a of ACCS) {
    const os = per[a.handle];
    if (!os) { GA.none.push(a); continue; }
    const hb = os.some(o => o.stance === 'bull'), hr = os.some(o => o.stance === 'bear');
    (hb && hr ? GA.mixed : hb ? GA.bullOnly : hr ? GA.bearOnly : GA.unclear).push(a);
  }
  const seg = [['bullOnly', '只睇好', 'b'], ['bearOnly', '只睇淡', 'r'], ['mixed', '好淡都有', 'n'], ['unclear', '唔明確', 'n'], ['none', '冇提及', 'x']];
  // 共識／分歧總結：用每個帳號喺呢段時間嘅最新立場
  const latest = Object.values(per).map(os => os[os.length - 1]);
  const lb = latest.filter(o => o.stance === 'bull').sort((a, b) => b.strength - a.strength || b.ts - a.ts);
  const lr = latest.filter(o => o.stance === 'bear').sort((a, b) => b.strength - a.strength || b.ts - a.ts);
  const ln = latest.filter(o => o.stance === 'neutral');
  const head = !latest.length ? `${wLabel()}冇帳號講過 ${tk}`

    : lr.length >= 2 ? `一致睇淡：${lr.length} 個帳號睇淡、冇人睇好`
    : lb.length || lr.length ? `證據有限：只有 ${lb.length + lr.length} 個帳號明確表態`
    : `冇明確立場：${ln.length} 個帳號提及但冇表態`;
  const reasons = os => os.length ? `<ul class="reasons">${os.map(o => `<li>${accBtn(o.handle)}${o.stance !== 'neutral' ? ' ' + '●'.repeat(o.strength) : ''} ${chgB(o)}：${esc(o.summary)} <a href="https://x.com/${esc(o.handle)}/status/${esc(o.id)}" target="_blank" rel="noopener">${md(o.ts)} 原帖</a></li>`).join('')}</ul>` : '<p class="empty">冇</p>';
  const rows = ACCS.filter(a => per[a.handle]).map(a => {
    const os = per[a.handle], b = os.filter(o => o.stance === 'bull').length, r = os.filter(o => o.stance === 'bear').length, n = os.length - b - r;
    const lo = os[os.length - 1], c = consistency(allT.filter(o => o.handle === a.handle));
    return `<tr><td>${accBtn(a.handle)}</td><td class="num">${os.length}</td><td class="num up">${b}</td>
      <td><div class="bar" style="width:90px"><i class="b" style="width:${b / os.length * 100}%"></i><i class="n" style="width:${n / os.length * 100}%"></i><i class="r" style="width:${r / os.length * 100}%"></i></div></td>
      <td class="num down">${r}</td><td class="num">${c == null ? '<span class="muted">—</span>' : Math.round(c * 100) + '%'}</td>
      <td class="why">${pill(lo)} ${chgB(lo)} ${md(lo.ts)}：${esc(lo.summary)} ${post(lo)}</td></tr>`;
  }).join('');
  const c = D.congress?.[tk];
  const winRet = (() => { if (!p?.series) return null; const s = p.series.filter(([d]) => Date.parse(d) >= NOW - DRILL_W * DAY - DAY); return s.length >= 2 ? s[s.length - 1][1] / s[0][1] - 1 : null; })();
  const chg = changes(365, o => o.ticker === tk);
  const kv = keyViews(allT, 10);
  const ap = afterPx(allT);
  $('drill').innerHTML = `<h2>個股追查<span class="n">喺上面撳任何股票代號就會換；撳帳號名睇帳號追查</span></h2><div class="box dbody">
    <div class="drill-h"><span class="t">${esc(tk)}</span>
      ${p ? `<span class="px">${p.last} · ${pct(p.r1d)} <span class="muted">${pxDay(tk)}</span> · ${pct(p.r28)} <span class="muted">28 日</span> · ${pct(p.r1y)} <span class="muted">一年</span></span>` : ''}
      ${winSeg()}</div>
    <div><h3 style="margin-bottom:6px">共識同分歧 <span class="muted" style="font-weight:400">${wLabel()}；每個帳號最新立場</span></h3>
      <p class="sumh">${esc(head)}</p>
      <div class="grid g2"><div><span class="lab bull">睇好理由</span>${reasons(lb)}</div><div><span class="lab bear">睇淡理由</span>${reasons(lr)}</div></div>
      ${ln.length ? `<p class="note">提及但冇表態：${ln.map(o => accBtn(o.handle)).join('、')}</p>` : ''}
      <p class="note">冇提過嘅帳號唔當中性；證據得一兩個帳號時，唔代表多數人咁睇。</p></div>
    <div><h3 style="margin-bottom:6px">股價走勢同觀點 <span class="muted" style="font-weight:400">收市價</span></h3>${priceChart(tk, allT)}
      ${ap.x.length ? `<p class="note">發帖當日收市起計到最新價：睇好觀點 ${ap.b.length} 條、平均 ${pct(ap.bAvg)}；睇淡觀點 ${ap.r.length} 條、平均 ${pct(ap.rAvg)}。只係描述發生咗乜，唔代表準確度。</p>` : ''}</div>
    <div style="display:grid;gap:8px"><h3>${ACCS.length} 個帳號觀點 <span class="muted" style="font-weight:400">${wLabel()}</span></h3>
      <div class="bar" style="height:10px">${seg.map(([k, , cls]) => GA[k].length ? `<i class="${cls}" style="width:${GA[k].length / ACCS.length * 100}%"></i>` : '').join('')}</div>
      <div class="stance-groups">${seg.map(([k, t]) => `<span class="g"><span class="muted">${GA[k].length} 人${t}</span>${k !== 'none' ? GA[k].map(a => `<span class="chipn">${accBtn(a.handle)}</span>`).join('') : ''}</span>`).join('')}</div></div>
    <div class="grid g4">${stat('參與帳號', Object.keys(per).length)}${stat('提及', win.length)}${stat('睇好 / 睇淡', `<span class="up">${win.filter(o => o.stance === 'bull').length}</span> / <span class="down">${win.filter(o => o.stance === 'bear').length}</span>`)}${stat('同期股價', winRet == null ? '<span class="muted">—</span>' : pct(winRet))}</div>
    <div><h3 style="margin-bottom:6px">帳號明細 <span class="muted" style="font-weight:400">${wLabel()}；冇提及嘅帳號唔當中性</span></h3>
      ${rows ? `<div class="scroll"><table><thead><tr><th>帳號</th><th>提及</th><th>睇好</th><th>立場組合</th><th>睇淡</th><th>立場一致性</th><th>最新觀點同理由</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">呢段時間冇帳號講過呢隻股，試下揀長啲嘅時間範圍。</p>'}</div>
    <div><h3 style="margin-bottom:6px">立場變化 <span class="muted" style="font-weight:400">全部記錄；每個帳號最近一次變化</span></h3>${changeList(chg, 15, '記錄入面冇帳號改變過對呢隻股嘅立場。')}</div>
    <div><h3 style="margin-bottom:6px">重要觀點 <span class="muted" style="font-weight:400">清楚表態或者立場有變，加埋發帖後股價</span></h3>
      ${kv.length ? opList(kv, {tk: false, px: true}) : '<p class="empty">冇清楚表態嘅觀點。</p>'}</div>
    <div><h3 style="margin-bottom:6px">觀點演變 <span class="muted" style="font-weight:400">全部 ${allT.length} 條，新到舊</span></h3>
      ${opList(allT.slice().reverse(), {tk: false})}</div>
    ${c ? `<div class="muted" style="font-size:12.5px">國會議員申報（近 90 日）：<span class="up">買 ${c.b}</span> / <span class="down">賣 ${c.s}</span>（${esc(c.people.slice(0, 4).join('、'))}${c.people.length > 4 ? '…' : ''}）</div>` : ''}
  </div>`;
}

    <div><h3 style="margin-bottom:6px">講過嘅股票 <span class="muted" style="font-weight:400">${wLabel()}；最後一欄＝最近一次明確表態之後股價</span></h3>

    <div><h3 style="margin-bottom:6px">全部觀點 <span class="muted" style="font-weight:400">${wLabel()}，新到舊</span></h3>${win.length ? opList(win.slice().reverse(), {who: false}) : '<p class="empty">冇。</p>'}</div>
  </div>`;
}

function render() {
  $('views').innerHTML = [['today', NOW === GEN ? '今日' : md(NOW)], ['week', '近 7 日'], ['month', '近 28 日']].map(([v, t]) => `<button data-view="${v}" aria-pressed="${v === VIEW}">${t}</button>`).join('');
  ({today: renderToday, week: renderWeek, month: renderMonth})[VIEW]();
  renderDrill();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-drill],[data-acc],[data-dw],[data-sort]');
  if (!t) return;
  const go = () => { renderDrill(); $('drill').scrollIntoView({behavior: 'smooth', block: 'start'}); };
  if (t.dataset.view) { VIEW = t.dataset.view; render(); }
  else if (t.dataset.drill) { DRILL = {k: 'tk', id: t.dataset.drill}; go(); }
  else if (t.dataset.acc) { DRILL = {k: 'acc', id: t.dataset.acc}; go(); }
  else if (t.dataset.dw) { DRILL_W = +t.dataset.dw; renderDrill(); }
  else if (t.dataset.sort) { SORT = {key: t.dataset.sort, dir: SORT.key === t.dataset.sort ? -SORT.dir : -1}; renderMonth(); }
});

const pxDates = Object.values(PX).map(v => v?.d).filter(Boolean).sort();
$('stamp').textContent = `資料截至 ${md(NOW)} ${new Date(NOW).toLocaleTimeString('en-GB', {timeZone: 'America/Los_Angeles', hour: '2-digit', minute: '2-digit'})} PT · 追蹤 ${ACCS.length} 個帳號${pxDates.length ? ` · 股價截至 ${md(Date.parse(pxDates[pxDates.length - 1] + 'T21:00:00Z'))}${pxDates[pxDates.length - 1] === ptDate(NOW) && +new Date(NOW).toLocaleString('en-US', {timeZone: 'America/Los_Angeles', hour: 'numeric', hour12: false}) < 13 ? '（盤中）' : ' 收市'}` : ''}${D.version ? ' · v' + D.version : ''}`;

// 揀日期：當嗰日 PT 收工（23:59）睇返個報告
const asof = $('asof'), asofNow = $('asof-now'), genDay = ptDate(GEN);
asof.max = genDay;
asof.min = ALL_OPS.length ? ptDate(ALL_OPS[0].ts) : genDay;
asof.value = genDay;
function setAsOf(day) {
  if (!day || day >= genDay) { day = genDay; NOW = GEN; OPS = ALL_OPS; PX = PX_ALL; }
  else {
    if (day < asof.min) day = asof.min;
    // PT 同 UTC 相差幾多個鐘（夏令 7、冬令 8）
    const h = +new Intl.DateTimeFormat('en-US', {timeZone: 'America/Los_Angeles', hour: 'numeric', hourCycle: 'h23'}).format(new Date(day + 'T12:00:00Z'));
    NOW = Date.parse(day + 'T23:59:59Z') + (12 - h) * 3600e3;
    OPS = ALL_OPS.filter(o => o.ts <= NOW);
    PX = pxAsOf(day);
  }
  asof.value = day;
  const past = NOW !== GEN;
  asofNow.hidden = !past;
  $('past').hidden = !past;
  $('past').textContent = past ? `你睇緊 ${day}（PT）當日收工時嘅狀態：之後嘅帖文唔計，股價用嗰日或之前最近一個收市價。` : '';
  $('stamp').hidden = past;
  if (DRILL?.k === 'tk' && !OPS.some(o => o.ticker === DRILL.id)) {
    const g = groups(between(NOW - 7 * DAY, NOW)).sort((a, b) => b.L.length - a.L.length || b.mentions - a.mentions)[0];
    DRILL = g ? {k: 'tk', id: g.tk} : null;
  }
  render();
}
asof.addEventListener('change', () => setAsOf(asof.value));
asofNow.addEventListener('click', () => setAsOf(genDay));

if (D.version) $('ver').textContent = `X 交易員共識 v${D.version}`;
const topG = groups(between(NOW - 7 * DAY, NOW)).sort((a, b) => b.L.length - a.L.length || b.mentions - a.mentions)[0];
DRILL = topG ? {k: 'tk', id: topG.tk} : null;
render();

// 追蹤名單：網頁提交加／減 follow 請求（Artifact 資料庫 follow_requests，只限擁有者讀寫），
// 排程任務每次開始時執行（consensus_watcher accounts sync），結果經 D.followLog 帶返嚟顯示。
(async () => {
  const box = $('follow-box'), LOG = D.followLog || {};
  const HANDLE_RE = /^[A-Za-z0-9_]{1,15}$/;
  const normHandle = raw => {
    let h = String(raw || '').trim();
    if (/^(https?:\/\/)?(www\.)?(x|twitter)\.com\//i.test(h)) h = h.split('?')[0].replace(/\/+$/, '').split('/').pop();
    h = h.replace(/^@/, '');
    return HANDLE_RE.test(h) ? h : null;
  };
  const when = iso => { const t = Date.parse(iso); return isNaN(t) ? '' : new Date(t).toLocaleString('zh-HK', {timeZone: 'America/Los_Angeles', hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}) + ' PT'; };
  let db = null, reqs = [], ready = false, busy = false, confirmRm = null, msg = null;
  const pending = () => reqs.filter(r => !LOG[r.id]);
  const pendingFor = h => pending().find(r => String(r.handle || '').toLowerCase() === h.toLowerCase());

  function render() {
    $('follow-n').textContent = `而家追蹤 ${ACCS.length} 個帳號${pending().length ? `；${pending().length} 個請求等緊處理` : ''}`;
    const rows = ACCS.map(a => {
      const pr = pendingFor(a.handle);
      const act = !db ? '' : pr ? `<span class="muted" style="font-size:12px">${pr.action === 'remove' ? '等緊減' : '已提交'}</span>`
        : confirmRm === a.handle ? `<button class="fbtn danger" data-f="rm-yes" data-h="${esc(a.handle)}" ${busy ? 'disabled' : ''}>確認減</button> <button class="fbtn" data-f="rm-no">取消</button>`
        : `<button class="fbtn" data-f="rm" data-h="${esc(a.handle)}">減 follow</button>`;
      return `<tr><td>${accBtn(a.handle)}</td><td><a class="muted" href="https://x.com/${esc(a.handle)}" target="_blank" rel="noopener">@${esc(a.handle)}</a></td>
        <td><span class="badge ${esc(a.type)}">${TYPE[a.type] || ''}</span></td><td class="why">${esc(a.note || '')}</td><td style="text-align:right">${act}</td></tr>`;
    }).join('');
    const adds = pending().filter(r => r.action === 'add' && !ACCS.some(a => a.handle.toLowerCase() === String(r.handle || '').toLowerCase()));
    const addRows = adds.map(r => `<tr><td><strong>${esc(r.name || r.handle)}</strong></td><td class="muted">@${esc(r.handle)}</td><td><span class="badge">${TYPE[r.type] || ''}</span></td><td class="why">${esc(r.note || '')}</td><td style="text-align:right"><span class="muted" style="font-size:12px">等緊加</span></td></tr>`).join('');
    const reqList = reqs.length ? `<h3 style="margin:16px 0 6px">提交過嘅請求 <span class="muted" style="font-weight:400">排程每日 07:15、13:15、19:15 PT 處理</span></h3>
      <ul class="tl">${reqs.map(r => {
        const l = LOG[r.id];
        const st = !l ? '<span class="pill neu">等緊處理</span>' : l.status === 'done' ? '<span class="pill bull">已生效</span>' : l.status === 'noop' ? '<span class="pill neu">唔使改</span>' : '<span class="pill bear">失敗</span>';
        return `<li><span class="muted num">${esc(when(r.createdAt))}</span><span><strong>${r.action === 'remove' ? '減' : '加'}</strong> @${esc(r.handle)}</span>
          <span>${st} ${l ? esc(l.msg) : ''} <button class="fbtn" data-f="del" data-id="${esc(r.id)}" ${busy ? 'disabled' : ''}>${l ? '清除' : '撤回'}</button></span></li>`;
      }).join('')}</ul>` : '';
    const form = db ? `<form class="fform" id="f-add" autocomplete="off">
        <label>X 用戶名<input name="handle" placeholder="@someone 或 x.com 網址" required></label>
        <label>顯示名<input name="name" maxlength="40" placeholder="唔填就用用戶名"></label>
        <label>類型<select name="type"><option value="opinion">觀點帳號</option><option value="news">市場新聞</option><option value="disclosure">交易披露</option></select></label>
        <label class="wide">簡介<input name="note" maxlength="80" placeholder="例如：半導體同 AI 供應鏈"></label>
        <button class="fbtn primary" type="submit" ${busy ? 'disabled' : ''}>加 follow</button>
      </form>` : `<p class="note">${ready ? '呢個版本唔可以改名單：請喺 claude.ai 嘅 Artifact 版加減，或者喺 Claude 對話講「加 follow @xxx」。' : '載入緊…'}</p>`;
    box.innerHTML = `<div class="scroll" style="border:0"><table><thead><tr><th>帳號</th><th>X</th><th>類型</th><th>簡介</th><th></th></tr></thead><tbody>${rows}${addRows}</tbody></table></div>
      ${form}${msg ? `<p class="fmsg ${msg[0]}">${esc(msg[1])}</p>` : ''}${reqList}
      ${db ? '<p class="note">提交之後會喺下次排程生效，新加嘅帳號第一次會抽返最近 5 日帖文。減走嘅帳號舊記錄唔會刪，再加返就會重新顯示。只有擁有者可以改名單。</p>' : ''}`;
  }

  const fail = e => { msg = ['err', e?.code === 'invalid_argument' ? '冇權限改名單（只有 Artifact 擁有者可以改）。' : e?.code === 'quota_exceeded' ? '請求太多，清除啲已處理嘅再試。' : '暫時存唔到，稍後再試。']; };
  async function submit(doc) {
    busy = true; msg = null; render();
    try { await db.collection('follow_requests').add({...doc, createdAt: new Date().toISOString()}); msg = ['ok', `已提交：${doc.action === 'add' ? '加' : '減'} @${doc.handle}，下次排程會處理。`]; }
    catch (e) { fail(e); }
    finally { busy = false; confirmRm = null; render(); }
  }
  box.addEventListener('submit', e => {
    if (e.target.id !== 'f-add') return;
    e.preventDefault();
    const f = new FormData(e.target), h = normHandle(f.get('handle'));
    if (!h) { msg = ['err', 'X 用戶名唔啱：只可以用英文字母、數字、底線，最多 15 個字。']; return render(); }
    if (ACCS.some(a => a.handle.toLowerCase() === h.toLowerCase())) { msg = ['err', `@${h} 已經喺名單入面。`]; return render(); }
    if (pendingFor(h)) { msg = ['err', `@${h} 已經有請求等緊處理。`]; return render(); }
    submit({action: 'add', handle: h, name: String(f.get('name') || '').trim().slice(0, 40), type: String(f.get('type') || 'opinion'), note: String(f.get('note') || '').trim().slice(0, 80)});
  });
  box.addEventListener('click', async e => {
    const t = e.target.closest('[data-f]');
    if (!t || busy) return;
    const f = t.dataset.f;
    if (f === 'rm') { confirmRm = t.dataset.h; msg = null; render(); }
    else if (f === 'rm-no') { confirmRm = null; render(); }
    else if (f === 'rm-yes') {
      if (ACCS.length - pending().filter(r => r.action === 'remove').length <= 1) { msg = ['err', '唔可以減到一個帳號都冇。']; confirmRm = null; return render(); }
      submit({action: 'remove', handle: t.dataset.h});
    } else if (f === 'del') {
      busy = true; render();
      try { await db.doc('follow_requests/' + t.dataset.id).delete(); msg = null; } catch (err) { fail(err); }
      finally { busy = false; render(); }
    }
  });

  render();
  db = window.claude?.use ? await window.claude.use('db') : null;
  ready = true; render();
  if (!db) return;
  db.collection('follow_requests').orderBy('createdAt', 'desc').limit(50).onSnapshot(
    snap => { reqs = snap.docs.map(d => ({id: d.id, ...d.data()})); render(); },
    () => { msg = ['err', '讀唔到請求紀錄，重新載入頁面再試。']; render(); });
})();

(async () => {
  const sample = window.claude?.use ? await window.claude.use('sample') : null;
  if (!sample) { $('ask-off').hidden = false; return; }
  $('ask-sec').hidden = false;
  const q = $('ask-q'), go = $('ask-go'), stop = $('ask-stop'), out = $('ask-out');
  let ctl = null, blocked = false;
  const COPY = {not_granted: '你冇批准使用 Claude，所以答唔到。', rate_limited: '問得太密，等一陣再試。',
    prompt_too_large: '資料太多，暫時答唔到。試下問得具體啲（講明股票代號或者帳號）。', sampling_disabled: '呢個帳戶用唔到 AI 問答。'};
  const TICKERS = new Set(OPS.map(o => o.ticker));
  const line = o => `${new Date(o.ts).toISOString().slice(0, 10)} ${nm(o.handle)}(@${o.handle}) ${o.ticker} ${LABEL[o.stance]}${o.stance !== 'neutral' ? '強度' + o.strength : ''}${o.chg ? '【' + o.chg[0] + '，之前' + LABEL[o.prev.stance] + '】' : ''}：${o.summary}`;
  const pxLine = t => { const v = PX[t]; return v ? `${t}: 最新 ${v.last}（${v.d || ''}）單日${(v.r1d * 100).toFixed(1)}% 28日${v.r28 == null ? '—' : (v.r28 * 100).toFixed(1) + '%'} 一年${v.r1y == null ? '—' : (v.r1y * 100).toFixed(1) + '%'}` : null; };
  async function ask(question) {
    if (!question.trim() || blocked) return;
    // 問題有講明股票或者帳號：嗰部分餵晒全部歷史；其他就餵近 28 日
    const upper = question.toUpperCase();
    const fT = [...new Set((upper.match(/[A-Z][A-Z.]{0,6}/g) || []).filter(w => TICKERS.has(w)))];
    const fA = ACCS.filter(a => question.toLowerCase().includes(a.handle.toLowerCase()) || question.includes(a.name)).map(a => a.handle);
    // 同時講明股票同帳號（例如「Serenity 點睇 SIVE」）：只要嗰幾隻股嘅全部歷史，唔使成個帳號
    const focus = o => fT.length ? fT.includes(o.ticker) : fA.includes(o.handle);
    const recent = between(NOW - 28 * DAY, NOW);
    const hist = fT.length || fA.length ? OPS.filter(focus) : [];
    // 有焦點時，其他近 28 日觀點只留有立場嘅做對照，控制 prompt 大細
    const rest = recent.filter(o => !focus(o) && (!hist.length || o.stance !== 'neutral'));
    const olderChg = OPS.filter(o => o.ts < NOW - 28 * DAY && o.chg && !focus(o)).slice(-80);
    const pxT = fT.length ? fT : Object.keys(PX);
    const an = Object.entries(D.analyses || {}).filter(([d]) => d <= ptDate(NOW)).sort().slice(-5).map(([d, t]) => `${d}：${t}`);
    const prompt = `你係整理 X 交易員觀點嘅研究助手。只可以根據下面資料答；資料冇嘅就講冇，唔好估。
優先做跨帳號比較（邊個睇好、邊個睇淡、理由點唔同），唔好淨係數提及次數。
分三層睇：
1. 而家立場：每個帳號最新明確表態同理由（註明日期）。
2. 近期變化：加強／減弱／反轉／分歧（資料入面【】標咗）。
3. 歷史背景：以前講過嘅點樣解釋而家立場；歷史係背景，唔好將舊提及次數加埋當證據。
問「風險」就整理睇淡理由、中性但涉及風險嘅消息、同埋立場反轉嘅原因。
如果只有少數帳號講過，要講明證據有限；冇提過嘅帳號唔可以當中性。
新聞帳號嘅立場只係標題好淡，交易披露帳號只係買賣紀錄，要分開講。
用廣東話、簡潔答，註明邊個帳號幾時講。唔好畀買賣建議、目標價或者「值得買」之類評價。

追蹤帳號：${ACCS.map(a => `${a.name}(@${a.handle}，${TYPE[a.type] || ''})`).join('、')}
資料截至：${D.generated}
${hist.length ? `\n【問題涉及嘅${fT.length ? '股票 ' + fT.join('、') : ''}${fA.length ? ' 帳號 ' + fA.map(nm).join('、') : ''}：全部歷史觀點，舊到新】\n${hist.map(line).join('\n')}\n` : ''}
【近 28 日${hist.length ? '其他有立場嘅' : '逐條'}觀點】
${rest.map(line).join('\n') || '（冇）'}

【28 日之前嘅立場變化（背景）】
${olderChg.map(line).join('\n') || '（冇）'}

【股價】
${pxT.map(pxLine).filter(Boolean).join('\n') || '（冇）'}

【每日分析】
${an.join('\n') || '（冇）'}

問題：${question}`;
    ctl = new AbortController();
    go.disabled = true; stop.hidden = false; out.textContent = '諗緊…';
    try {
      await sample(prompt, {signal: ctl.signal, onText: ({text}) => { out.textContent = text; }});
    } catch (e) {
      out.textContent = e.text || '';
      if (e.code !== 'cancelled') out.textContent += (out.textContent ? '\n\n' : '') + (COPY[e.code] || '暫時答唔到，稍後再試。');
      if (e.code === 'not_granted' || e.code === 'sampling_disabled') blocked = true;
    } finally { go.disabled = blocked; stop.hidden = true; }
  }
  go.onclick = () => ask(q.value);
  stop.onclick = () => ctl?.abort();
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask(q.value); });
  document.querySelectorAll('#ask-sec [data-q]').forEach(b => b.onclick = () => { q.value = b.dataset.q; ask(b.dataset.q); });
})();
})();
</script>

<script>
(() => {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
